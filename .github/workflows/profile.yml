name: Refresh profile cards

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - templates/**
      - fonts/**
      - package.json
      - package-lock.json
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Generate SVG cards
        run: node scripts/build.mjs
        env:
          # PROFILE_TOKEN (read-only fine-grained token) lets private repositories count;
          # without it, repository figures are kept from the last full run.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          FULL_SCOPE: ${{ secrets.PROFILE_TOKEN != '' }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- assets/generated data)" ]; then
            echo "Cards are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated data
          git commit -m "Refresh profile cards"
          git push
